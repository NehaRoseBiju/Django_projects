<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background: #f4f6f9;
            font-family: Arial, Helvetica, sans-serif;
        }
        .container{
            width: 350px;
            margin: 100px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }
        input{
            width: 100%;
            padding: 10px;
            margin: 10px 0;
        }
        button{
            background: #007bff;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
        }
    </style>
</head>
<body>
    <div>
        <h2>login</h2>
        <form method="POST">
            {% csrf_token %}
            <input type="text" name="username" placeholder="username">
            <input type="text" name="password" placeholder="password">
            <button type="submit">Submit</button>
        </form>
    </div>
</body>
</html>
