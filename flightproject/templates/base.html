<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flight Booking System</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
body{
    font-family:'Segoe UI',sans-serif;
    background:#f4f7fc;
    color:#333;
}
/* Navbar */
.navbar{
    background:linear-gradient(135deg,#003366,#0055aa);
    padding:15px 50px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 2px 8px rgba(0,0,0,0.2);
}
.nav-links a{
    color:white;
    text-decoration:none;
    margin-left:25px;
    font-weight:500;
    transition:0.3s;
}
.nav-links a:hover{
    color:#ffd700;
}
/* Hero Section */
.hero{
    background:linear-gradient(
        135deg,
        #003366,
        #0055aa,
        #0088cc
    );
    color:white;
    text-align:center;
    padding:70px 20px;
    border-bottom-left-radius:20px;
    border-bottom-right-radius:20px;
}
.hero h1{
    font-size:42px;
    margin-bottom:15px;
}
.hero p{
    font-size:18px;
}
/* Main Content */
.container{
    width:90%;
    max-width:1200px;
    margin:30px auto;
}
/* Cards */
.card{
    background:white;
    padding:20px;
    margin-bottom:20px;
    border-radius:12px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}
/* Form Elements */
input,
select{
    width:100%;
    padding:12px;
    margin-top:10px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:6px;
}
button{
    width:100%;
    padding:12px;
    background:#0055aa;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-size:16px;
}
button:hover{
    background:#003f80;
}
/* Buttons */
.btn{
    display:inline-block;
    padding:8px 14px;
    border-radius:5px;
    text-decoration:none;
    color:white;
    margin-right:5px;
}
.book{
    background:#28a745;
}
.update{
    background:#007bff;
}
.delete{
    background:#dc3545;
}
/* Footer */
footer{
    margin-top:50px;
    background:#003366;
    color:white;
    text-align:center;
    padding:15px;
}
</style>
</head>
<body>
<nav class="navbar">
<div class="logo">
✈ SkyFly
</div>
<a href="/">Flights</a>
<a href="/add/">Add Flight</a>
<a href="/search/">Search</a>
<a href="/admin/">Admin</a>
</div>
</nav>
<div class="hero">
<h1>Flight Booking System</h1>
<p>Book your next journey with ease</p>
</div>
<div class="container">
{% block content %}
{% endblock %}
</div>
<footer>
© 2026 Flight Booking System | Developed using Django
</footer>
</body>
</html>
