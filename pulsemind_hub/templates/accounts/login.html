{% extends 'base.html' %}
{% load static %}

{% block title %}Login - PulseMind Hub{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 3rem auto;">
  <div class="card" style="box-shadow: var(--shadow-lg); border-top: 5px solid var(--primary);">
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <img src="{% static 'images/logo.svg' %}" alt="PulseMind Hub" style="height: 52px; margin-bottom: 0.75rem;">
      <h2 style="font-size: 1.5rem; color: #064e3b;">Welcome Back</h2>
      <p style="color: var(--muted-text); font-size: 0.9rem;">Sign in to access your health dashboard and video calls</p>
    </div>

    <form method="POST">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control" placeholder="Enter your username" required autofocus>
      </div>

      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <label class="form-label">Password</label>
          <a href="{% url 'accounts:password_reset' %}" style="font-size: 0.8rem;">Forgot password?</a>
        </div>
        <input type="password" name="password" class="form-control" placeholder="Enter password" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
        Sign In to PulseMind Hub
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--muted-text);">
      Don't have an account? <a href="{% url 'accounts:register' %}" style="font-weight: 600;">Register Now</a>
    </div>
  </div>
</div>
{% endblock %}
