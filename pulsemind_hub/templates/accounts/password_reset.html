{% extends 'base.html' %}

{% block title %}Reset Password - PulseMind Hub{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 3rem auto;">
  <div class="card">
    <h2 style="margin-bottom: 0.5rem;">Reset Password</h2>
    <p style="color: var(--muted-text); font-size: 0.9rem; margin-bottom: 1.5rem;">
      Enter your registered email address below and we'll send password reset instructions to your inbox.
    </p>

    <form method="POST">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" name="email" class="form-control" placeholder="user@example.com" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%;">Send Reset Link</button>
    </form>
    
    <div style="text-align: center; margin-top: 1rem;">
      <a href="{% url 'accounts:login' %}" style="font-size: 0.85rem;">Back to Login</a>
    </div>
  </div>
</div>
{% endblock %}
