{% extends 'base.html' %}

{% block title %}My Profile - PulseMind Hub{% endblock %}

{% block content %}
<div style="max-width: 800px; margin: 0 auto;">
  <div class="card">
    <div class="card-header">
      <div>
        <h2>User Profile & Settings</h2>
        <p style="color: var(--muted-text); font-size: 0.9rem;">
          Role: <span class="badge {% if user.is_doctor %}badge-doctor{% else %}badge-patient{% endif %}">{{ user.get_role_display }}</span>
        </p>
      </div>
    </div>

    <form method="POST">
      {% csrf_token %}
      {{ form.as_p }}
      <div style="margin-top: 1.5rem; text-align: right;">
        <button type="submit" class="btn btn-primary">Save Profile Changes</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
